[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "0.1.0"
description = "False omission rate guarantees under evolving traffic for network intrusion detection"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pyarrow>=14",
    "pypdf>=4.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "nbconvert>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
