# Theorem 1 on synthetic scores with a known false omission rate, how often a certified threshold exceeds epsilon
inherit: [../base.yaml]

experiment:
  name: e10_synthetic_certify
  module: synthetic_certify

certify:
  epsilon: 0.001
  delta: 0.05
  # the rest of delta goes to the miss rate bounds, split over the attack families
  delta_benign: 0.025
  pi_max: 0.1
  # thresholds at the benign quantiles j / (grid_size + 1)
  grid_size: 200

synthetic:
  benign: {a: 2, b: 8}
  # beta distributions of the attack families from the heaviest low tail to the lightest, share is the family mix of
  # the calibration set
  families:
    - {name: f1, a: 4, b: 3, share: 0.1}
    - {name: f2, a: 5, b: 2.5, share: 0.2}
    - {name: f3, a: 6, b: 2, share: 0.3}
    - {name: f4, a: 8, b: 2, share: 0.4}
  # attack prevalence of the calibration set
  prevalence: 0.02

simulation:
  methods: [forge_simplex, forge_pooled, ltt_iid, forge_strict]
  # flows in the calibration set
  sizes: [100000, 300000, 1000000, 3000000, 10000000, 30000000, 100000000]
  main_size: 30000000
  draws: 10000
  # deployment prevalences at which the certified thresholds are evaluated
  prevalences: [0.001, 0.002, 0.005, 0.01, 0.02, 0.03, 0.05, 0.07, 0.1, 0.15, 0.2, 0.3]
