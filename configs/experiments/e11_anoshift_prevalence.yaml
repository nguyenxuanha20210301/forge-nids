# RQ1 on AnoShift, the false omission rate and the dismissed share of each method in deployment windows whose attacks
# are thinned to a range of prevalences
inherit: [../base.yaml, ../data/anoshift.yaml]

experiment:
  name: e11_anoshift_prevalence
  module: for_vs_prevalence

# first and last year of each role, training, selection and calibration in the IID period of AnoShift, deployment in
# its last IID year and in the NEAR and FAR periods. the blocks of every deployment year drift from the calibration
# year, the IID one too
split:
  train: [2006, 2007]
  selection: [2008, 2008]
  calibration: [2009, 2009]
  deployment: [2010, 2015]

scorer:
  # boosting rounds at most, training stops once the loss on the selection year has not improved for early_stopping
  # rounds
  rounds: 1000
  early_stopping: 50
  params:
    objective: binary
    metric: binary_logloss
    learning_rate: 0.1
    num_leaves: 63
    min_data_in_leaf: 100
    feature_fraction: 0.9
    bagging_fraction: 0.8
    bagging_freq: 1
    deterministic: true
    force_col_wise: true
    verbosity: -1

certify:
  epsilon: 0.001
  delta: 0.05
  # share of delta for the benign bound offline and for the bound on the window's dismissed share online, the rest
  # goes to the miss rate bound of each attack family
  delta_benign: 0.025
  pi_max: 0.1
  # the sequence starts at the loosest threshold that would pass with up to start_misses misses in every family, as
  # long as it dismisses at most start_slack more than the first threshold that would pass with no miss
  start_misses: 2
  start_slack: 0.05
  # LTT starts its sequence by the same rule, with attacks among the dismissed flows in place of misses and the share
  # of calibration flows dismissed in place of the benign one, false starts it at the first threshold that could pass
  # with no attack
  ltt_guarded_start: true
  # the miss rate of the two baselines at a published level, Şahin and Mert at the beta of their paper on average
  # over the calibration draw and the Neyman-Pearson umbrella of Tong, Feng and Li at the same level with
  # probability 1 - delta. conformal selection of Jin and Candès holds the share of attacks among the dismissed
  # flows of a window at epsilon on average and needs no level of its own
  fnr_level: 0.01
  # thresholds at the benign quantiles j / (grid_size + 1) of the selection year. steps of 0.1% of the benign sessions
  # keep apart the baselines, whose thresholds lie within the top 1%
  grid_size: 1000
  # an attack type is its own family only when its expected calibration attacks could certify, with no miss, a
  # threshold dismissing this share of the benign sessions, 1,364 attacks at the values above. the others are merged
  family_floor: 0.3
  # LTT at a prevalence estimated on the window, plug in and upper bound. the threshold t_star is fixed on the
  # selection year at the point where the benign and the attack shares at the calibration mix differ most, the
  # estimate reads the shares at or below it, and the upper bound takes a two sided DKW event on the benign cdf of
  # the calibration draw at delta_benign, which also serves the certificate's benign bound, the window's one sided
  # DKW bound at delta_window and a Clopper-Pearson bound on the miss rate at t_star at delta_miss, the family bound
  # of the certificate keeping the rest of delta
  estimate:
    threshold: ks
    delta_benign: 0.01
    delta_window: 0.01
    delta_miss: 0.005

calibration:
  # the calibration years keep all their benign sessions and have their attacks thinned to this prevalence
  prevalence: 0.02

deployment:
  # each block of a deployment year keeps all its benign sessions and has its attacks thinned to each prevalence
  prevalences: [0.001, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2]
  # the mix of attack types among the attacks of a window, window for the block's own, calibration for the mix of the
  # calibration set, or the name of one attack type. the FORGE claim covers every mix while each type is its own
  # family, and the calibration mix once rare types are merged. the unknown type, 3.7% of the attacks of 2009, expects
  # about 3,684 calibration attacks and stands alone
  mixes: [window, known]
  # the prevalence of the figure over windows
  main_prevalence: 0.1
  # the period whose blocks also get reference windows, with the benign count, prevalence and mix of the block's
  # window and the score distributions of the calibration year, so label shift holds by construction. RQ1 is read on
  # them, the real windows of every period show the drift
  main_period: iid

simulation:
  methods: [forge_simplex, forge_online, ltt_iid, ltt_plugin, ltt_upper, conformal_selection, conformal_fnr,
            sahin_mert, np_umbrella, fixed_sel]
  draws: 1000
